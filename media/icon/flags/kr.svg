<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <rect width="30" height="20" fill="#fff"/>

  <!-- 태극 -->
  <circle cx="15" cy="10" r="5" fill="#003478"/>
  <path fill="#c60c30"
        d="M10 10 a5 5 0 0 1 10 0 a2.5 2.5 0 0 1 -5 0 a2.5 2.5 0 0 0 -5 0 z"/>

  <!-- 4괘 -->
  <g fill="#000">
    <!-- 건(乾) 좌상 -->
    <g transform="translate(6.5 5.5) rotate(-34)">
      <rect x="-2.2" y="-1.45" width="4.4" height="0.7"/>
      <rect x="-2.2" y="-0.35" width="4.4" height="0.7"/>
      <rect x="-2.2" y="0.75" width="4.4" height="0.7"/>
    </g>
    <!-- 감(坎) 우상 -->
    <g transform="translate(23.5 5.5) rotate(34)">
      <rect x="-2.2" y="-1.45" width="1.8" height="0.7"/><rect x="0.4" y="-1.45" width="1.8" height="0.7"/>
      <rect x="-2.2" y="-0.35" width="4.4" height="0.7"/>
      <rect x="-2.2" y="0.75" width="1.8" height="0.7"/><rect x="0.4" y="0.75" width="1.8" height="0.7"/>
    </g>
    <!-- 리(离) 좌하 -->
    <g transform="translate(6.5 14.5) rotate(34)">
      <rect x="-2.2" y="-1.45" width="4.4" height="0.7"/>
      <rect x="-2.2" y="-0.35" width="1.8" height="0.7"/><rect x="0.4" y="-0.35" width="1.8" height="0.7"/>
      <rect x="-2.2" y="0.75" width="4.4" height="0.7"/>
    </g>
    <!-- 곤(坤) 우하 -->
    <g transform="translate(23.5 14.5) rotate(-34)">
      <rect x="-2.2" y="-1.45" width="1.8" height="0.7"/><rect x="0.4" y="-1.45" width="1.8" height="0.7"/>
      <rect x="-2.2" y="-0.35" width="1.8" height="0.7"/><rect x="0.4" y="-0.35" width="1.8" height="0.7"/>
      <rect x="-2.2" y="0.75" width="1.8" height="0.7"/><rect x="0.4" y="0.75" width="1.8" height="0.7"/>
    </g>
  </g>
</svg>
